<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Badge: Vibrant Royal Sapphire Gradient (Zero Dark Black) -->
  <defs>
    <linearGradient id="pBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="45%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Top Ribbon Gradient: Pure Luminous White to Ice Blue -->
    <linearGradient id="pWhiteGlow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Mid Twist Gradient: Vivid Electric Sky Cyan to Cobalt -->
    <linearGradient id="pCyanFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Lower Stem: Bright White to Aqua -->
    <linearGradient id="pStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Inner Triangle Play/Compass Cutout -->
    <linearGradient id="pPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <!-- 1. Squircle Base Badge (Rich Royal Sapphire Blue) -->
  <rect width="512" height="512" rx="112" fill="url(#pBadgeBg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#60A5FA" stroke-width="6" stroke-opacity="0.5"/>

  <!-- 2. The 3D Ribbon 'P' Symbol (Pure Solid Vector Paths) -->
  
  <!-- A. Inner Play-Arrow Triangle (Center Left) -->
  <polygon points="145,160 280,240 145,310" fill="url(#pPlay)"/>

  <!-- B. Main Upper Curved White Ribbon (Sweeps around the entire right perimeter) -->
  <!-- Top Bar & Right Loop -->
  <path d="M110,80 L330,80 C410,80 455,130 455,215 C455,295 405,350 315,360 C260,366 235,395 235,420 L150,470 L150,310 C180,315 220,315 250,290 C325,230 375,215 375,175 C375,130 325,115 260,115 L170,115 Z" fill="url(#pWhiteGlow)"/>

  <!-- C. Dynamic Cyan Origami Twist Fold (The Blue Wave across the middle) -->
  <path d="M145,310 C175,250 240,210 325,225 C375,235 400,215 415,175 C425,235 390,285 320,305 C250,325 185,305 145,310 Z" fill="url(#pCyanFold)"/>

  <!-- D. Lower Pillar Stem (Bottom Left Foot) -->
  <path d="M145,310 C185,290 230,310 240,350 C245,370 240,395 235,420 L150,470 Z" fill="url(#pStem)"/>
</svg>
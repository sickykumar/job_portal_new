<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Ultra-vibrant background gradient (visible on both dark and light browser tabs) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5"/>
      <stop offset="50%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>

    <!-- Top facet with bright reflection -->
    <linearGradient id="pkWhiteGlow" x1="0" y1="0" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#E0F2FE"/>
    </linearGradient>

    <!-- Glowing Cyan/Emerald dynamic pathway vector -->
    <linearGradient id="pkNeonPath" x1="16" y1="36" x2="40" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#2DD4BF"/>
      <stop offset="100%" stopColor="#34D399"/>
    </linearGradient>

    <!-- High-contrast crisp drop shadow -->
    <filter id="pkDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" floodColor="#0F172A" floodOpacity="0.5"/>
    </filter>
  </defs>

  <!-- Bright, eye-catching 3D Squircle Base Badge -->
  <rect width="48" height="48" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner bevel highlight ring for 3D look -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- High-contrast crisp white 'P' (Path) Structure -->
  <!-- Left Vertical Spine of 'P' -->
  <rect x="10" y="10" width="7.5" height="28" rx="3.75" fill="url(#pkWhiteGlow)" filter="url(#pkDrop)"/>

  <!-- Curved Head of 'P' -->
  <path d="M14 10H26C31.5 10 35 13.8 35 18.5C35 23.2 31.5 27 26 27H14V10Z" fill="url(#pkWhiteGlow)" filter="url(#pkDrop)"/>
  <!-- Hollow Inner cutout of 'P' revealing vibrant base -->
  <path d="M17.5 15.5H25C27.5 15.5 29.5 16.8 29.5 18.5C29.5 20.2 27.5 21.5 25 21.5H17.5V15.5Z" fill="url(#bgGrad)"/>

  <!-- 3D Neon "Khojo" Ascending Rocket/Pathway Arrow (Dynamic Overlay) -->
  <path d="M20 37L37 20L32.5 16L17 31.5L20 37Z" fill="url(#pkNeonPath)" filter="url(#pkDrop)"/>
  <path d="M37 20L41 10L31 14L34 17L37 20Z" fill="#34D399" filter="url(#pkDrop)"/>

  <!-- Luminous Guiding North Star (Polaris) at Destination -->
  <circle cx="41" cy="10" r="4.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="41" cy="10" r="2.2" fill="#FFFFFF"/>
</svg>
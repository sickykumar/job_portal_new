<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="pkTop" x1="0" y1="0" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#818CF8"/>
      <stop offset="100%" stopColor="#C084FC"/>
    </linearGradient>
    <linearGradient id="pkLeft" x1="6" y1="12" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5"/>
      <stop offset="100%" stopColor="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="pkPath" x1="20" y1="40" x2="42" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4"/>
      <stop offset="60%" stopColor="#10B981"/>
      <stop offset="100%" stopColor="#34D399"/>
    </linearGradient>
    <radialGradient id="pkStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="40%" stopColor="#67E8F9"/>
      <stop offset="100%" stopColor="#06B6D4" stopOpacity="0"/>
    </radialGradient>
    <filter id="pkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" floodColor="#000" floodOpacity="0.5"/>
    </filter>
  </defs>

  <!-- 3D Beveled Rounded Container -->
  <rect width="48" height="48" rx="14" fill="#0B1120"/>
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="url(#pkTop)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Base 3D Plane -->
  <path d="M8 28L22 36L40 26L26 18L8 28Z" fill="url(#pkLeft)" opacity="0.35"/>

  <!-- Isometric 'P' Pillar -->
  <path d="M10 14L18 10V34L10 38V14Z" fill="url(#pkLeft)" filter="url(#pkShadow)"/>
  <path d="M10 14L18 10L26 14L18 18L10 14Z" fill="url(#pkTop)"/>

  <!-- 'P' Loop -->
  <path d="M18 10H30C34.4 10 37 13.5 35 17.5C33.2 21 29 23 24 23H18V10Z" fill="url(#pkTop)" filter="url(#pkShadow)"/>

  <!-- Ascending Khojo Pathway Vector -->
  <path d="M22 38L38 18L33 14L19 32L22 38Z" fill="url(#pkPath)" filter="url(#pkShadow)"/>
  <path d="M38 18L42 8L32 12L34.5 15L38 18Z" fill="#34D399"/>

  <!-- Guiding North Star -->
  <circle cx="42" cy="8" r="5" fill="url(#pkStar)"/>
  <circle cx="42" cy="8" r="1.8" fill="#FFFFFF"/>
</svg>